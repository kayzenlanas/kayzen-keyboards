# Despliegue en Netlify — sitio estático, sin build.
# Arrastra esta carpeta a https://app.netlify.com/drop  o conecta el repo.
[build]
  publish = "."
  command = ""

# Cabeceras de seguridad y caché básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
